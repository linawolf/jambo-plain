<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <f:comment>
        One point: the picture on the left, the words on the right. The picture
        carries an empty alt - it repeats what the text beside it already says,
        and a screen reader reading both would say everything twice.
    </f:comment>
    <div class="easy-point">
        <f:if condition="{files}">
            <div class="easy-point__picture">
                <f:for each="{files}" as="file">
                    <f:media file="{file}" width="160" height="160c" alt="" loading="lazy" decoding="async" />
                </f:for>
            </div>
        </f:if>
        <div class="easy-point__text">
            <f:format.html>{data.bodytext}</f:format.html>
        </div>
    </div>
</f:section>
</html>
