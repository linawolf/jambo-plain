<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    One hit. The size, creation date and rating of the original partial are
    dropped; what helps a visitor is the title, the path and the excerpt with
    the search word marked.
</f:comment>
<li class="search-result">
    <h3 class="search-result__title">{row.title -> f:format.raw()}</h3>
    <div class="search-result__path"><f:format.html>{row.path}</f:format.html></div>
    <f:if condition="{row.description}">
        <p class="search-result__excerpt">{row.description -> f:format.raw()}</p>
    </f:if>
</li>
</html>
