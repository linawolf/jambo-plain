<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Copy of the partial of EXT:form with one addition: autocomplete="off".
    Browsers and password managers fill hidden-by-css text fields, which makes
    the honeypot reject a real visitor who uses autofill - and they get no hint
    why their message vanished.
</f:comment>
<f:if condition="{element.properties.renderAsHiddenField}">
    <f:then>
        <f:form.hidden property="{element.identifier}" id="{element.uniqueIdentifier}" data="{id: element.identifier}" />
    </f:then>
    <f:else>
        <f:form.textfield property="{element.identifier}" id="{element.uniqueIdentifier}" class="{element.properties.elementClassAttribute}" data="{id: element.identifier}" additionalAttributes="{aria-hidden: 'true', autocomplete: 'off'}" tabindex="-1" style="{element.properties.styleAttribute}" />
    </f:else>
</f:if>
</html>
